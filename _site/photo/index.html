<script>
// 处理外部链接，避免地址栏闪烁
(function() {
  // 使用立即执行函数，确保代码尽早执行
  function handleExternalLinks() {
    const externalLinks = document.querySelectorAll('.external-link');
    externalLinks.forEach(function(link) {
      // 使用mousedown事件，在click之前拦截
      link.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        const url = this.getAttribute('data-external-url');
        if (url) {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
        return false;
      }, true);
    });
  }
  
  // 如果DOM已加载，立即执行；否则等待DOMContentLoaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', handleExternalLinks);
  } else {
    handleExternalLinks();
  }
})();
</script>

<style>
body, html {
  overflow-x: hidden;
  max-width: 100%;
}

.container.photo-page {
  max-width: none;
  width: 100%;
  padding-left: 0;
  padding-right: 0;
}

.photo-gallery {
  width: calc(100vw - 2rem);
  max-width: none;
  margin: 0 auto 3rem;
  padding: 2.5rem 1rem 0;
}

.photo-next-stop {
  text-align: center;
  margin: 2.75rem 0 0.5rem;
  font-family: Poppins, sans-serif;
  font-size: 0.78rem;
  font-weight: 300;
  letter-spacing: 0.03em;
  color: #9a9a9a;
}

.photo-tabs {
  text-align: center;
  margin: 0 0 2rem;
}

.tab-buttons {
  display: inline-flex;
  background: #f4eef2;
  border-radius: 999px;
  padding: 5px;
  box-shadow: 0 2px 10px rgba(80, 30, 70, 0.08);
}

.tab-btn {
  background: none;
  border: none;
  padding: 11px 22px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  font-family: Poppins, sans-serif;
  font-weight: 500;
  font-size: 0.95rem;
  color: #5a3d55;
}

.tab-btn.active {
  background: #7F3B83;
  color: #fff;
  box-shadow: 0 2px 8px rgba(127, 59, 131, 0.28);
}

.tab-btn:hover:not(.active) {
  background: #eadde6;
  color: #4a274d;
}

.tab-btn:focus-visible {
  outline: 2px solid #7F3B83;
  outline-offset: 3px;
}

.photo-masonry {
  display: grid;
  grid-template-columns: repeat(var(--photo-cols, 1), minmax(0, 1fr));
  gap: 1.5rem;
  width: 100%;
}

.photo-col {
  display: grid;
  gap: 1.5rem;
  align-content: start;
}

.photo-tile {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: #f4eef2;
  border-radius: 10px;
  overflow: hidden;
  cursor: zoom-in;
  box-shadow: 0 6px 18px rgba(40, 16, 36, 0.12);
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 0.25s ease;
}

.photo-tile.is-inview {
  opacity: 1;
  transform: none;
}

.photo-tile:hover,
.photo-tile:focus-visible {
  box-shadow: 0 10px 26px rgba(40, 16, 36, 0.2);
  transform: translateY(-3px);
}

.photo-tile:focus-visible {
  outline: 2px solid #7F3B83;
  outline-offset: 3px;
}

.photo-tile img {
  display: block;
  width: 100%;
  height: auto;
}

.photo-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem;
  background: rgba(12, 8, 14, 0.92);
}

.photo-modal[hidden] {
  display: none;
}

#modalImage {
  max-width: min(92vw, 1400px);
  max-height: 88vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}

.photo-modal-close {
  position: absolute;
  top: 14px;
  right: 22px;
  border: 0;
  background: none;
  color: #fff;
  font-size: 2.4rem;
  line-height: 1;
  cursor: pointer;
}

.photo-modal-close:hover,
.photo-modal-close:focus-visible {
  color: #e4d3db;
  outline: none;
}

@media (max-width: 640px) {
  .photo-gallery {
    width: calc(100vw - 1.25rem);
  }
  .tab-btn {
    padding: 10px 16px;
    font-size: 0.88rem;
  }
}

<script>
(function () {
  const digital = document.getElementById('digital-photos');
  const film = document.getElementById('film-photos');
  const modal = document.getElementById('photoModal');
  const modalImage = document.getElementById('modalImage');
  const closeBtn = modal.querySelector('.photo-modal-close');
  const shuffled = { digital: false, film: false };
  const order = { digital: null, film: null };

  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-inview');
        io.unobserve(entry.target);
      }
    });
  }, { rootMargin: '80px 0px', threshold: 0.05 });

  function watch(root) {
    root.querySelectorAll('.photo-tile').forEach(function (tile) {
      io.observe(tile);
    });
  }

  var MIN_COL = 280;

  function columnCount() {
    var width = (digital && !digital.hidden ? digital : film).clientWidth || window.innerWidth;
    var gap = 24;
    return Math.max(1, Math.floor((width + gap) / (MIN_COL + gap)));
  }

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
    }
    return list;
  }

  function unwrapTiles(root) {
    root.querySelectorAll('.photo-col').forEach(function (col) {
      while (col.firstChild) root.appendChild(col.firstChild);
      col.remove();
    });
    return Array.prototype.slice.call(root.querySelectorAll(':scope > .photo-tile'));
  }

  function tileHeight(tile, colWidth) {
    var img = tile.querySelector('img');
    var w = img.naturalWidth || 3;
    var h = img.naturalHeight || 2;
    return colWidth * (h / w);
  }

  function panelKey(root) {
    return root.id === 'digital-photos' ? 'digital' : 'film';
  }

  function layout(root, shouldShuffle) {
    if (!root) return;
    unwrapTiles(root);
    var key = panelKey(root);
    var tiles;
    if (shouldShuffle || !order[key]) {
      tiles = Array.prototype.slice.call(root.querySelectorAll(':scope > .photo-tile'));
      if (!tiles.length) return;
      shuffle(tiles);
      order[key] = tiles.slice();
    } else {
      tiles = order[key];
    }
    root.style.height = '';
    tiles.forEach(function (tile) {
      tile.style.width = '';
      tile.style.height = '';
      tile.style.left = '';
      tile.style.top = '';
    });
    var n = columnCount();
    var gap = 24;
    var colWidth = Math.max(1, (root.clientWidth - gap * (n - 1)) / n);
    root.style.setProperty('--photo-cols', String(n));
    var cols = [];
    var heights = [];
    for (var i = 0; i < n; i++) {
      var col = document.createElement('div');
      col.className = 'photo-col';
      root.appendChild(col);
      cols.push(col);
      heights.push(0);
    }
    tiles.forEach(function (tile) {
      var shortest = 0;
      for (var c = 1; c < n; c++) {
        if (heights[c] < heights[shortest]) shortest = c;
      }
      cols[shortest].appendChild(tile);
      heights[shortest] += tileHeight(tile, colWidth) + gap;
    });
    watch(root);
  }

  function whenImagesReady(root, cb) {
    var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
    var left = imgs.length;
    if (!left) return cb();
    function done() {
      left -= 1;
      if (left <= 0) cb();
    }
    imgs.forEach(function (img) {
      if (img.complete && img.naturalWidth) done();
      else {
        img.addEventListener('load', done, { once: true });
        img.addEventListener('error', done, { once: true });
      }
    });
  }

  layout(digital, true);
  shuffled.digital = true;
  whenImagesReady(digital, function () {
    layout(digital, false);
  });
  whenImagesReady(film, function () {
    if (!film.hidden) layout(film, false);
  });

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const tab = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-btn').forEach(function (b) {
        const on = b === btn;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      digital.hidden = tab !== 'digital';
      film.hidden = tab !== 'film';
      const root = tab === 'digital' ? digital : film;
      const key = tab;
      layout(root, !shuffled[key]);
      shuffled[key] = true;
    });
  });

  var resizeTimer;
  var lastCols = columnCount();
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var next = columnCount();
      if (next === lastCols) return;
      lastCols = next;
      layout(digital.hidden ? film : digital, false);
    }, 120);
  });

  function openModal(src, alt) {
    modalImage.src = src;
    modalImage.alt = alt || '';
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeModal() {
    modal.hidden = true;
    modalImage.src = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.photo-tile').forEach(function (tile) {
    tile.addEventListener('click', function () {
      openModal(tile.getAttribute('data-src'), tile.querySelector('img').alt);
    });
  });

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();
</script>
